name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: v
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Semantic version format
        run: |
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION || {
            echo "VERSION must be MAJOR.MINOR.PATCH, found: $(cat VERSION)"; exit 1; }

      - name: Changelog entry for this version
        run: |
          grep -q "^## \[${{ steps.v.outputs.value }}\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [${{ steps.v.outputs.value }}]' section"; exit 1; }

      - name: Version bumped against the base branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          base="$(git show FETCH_HEAD:VERSION 2>/dev/null || echo none)"
          echo "base=$base head=${{ steps.v.outputs.value }}"
          if [ "$base" = "${{ steps.v.outputs.value }}" ]; then
            echo "VERSION was not bumped - every change needs its own version"
            exit 1
          fi

      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "${GITHUB_REF_NAME}" = "v${{ steps.v.outputs.value }}" || {
            echo "tag ${GITHUB_REF_NAME} does not match VERSION v${{ steps.v.outputs.value }}"; exit 1; }

  scripts:
    name: Scripts and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax
        run: bash -n install.sh uninstall.sh

      - name: ShellCheck
        run: shellcheck --version && shellcheck install.sh uninstall.sh

      - name: Pinned installer matches the shipped image
        run: |
          set -euo pipefail
          app="$(grep -oE '^APP_VERSION="[^"]+"' install.sh | cut -d'"' -f2)"
          repo="$(grep -oE '^REPO_VERSION="[^"]+"' install.sh | cut -d'"' -f2)"
          sha="$(grep -oE '^APP_SHA256="[^"]+"' install.sh | cut -d'"' -f2)"
          test "${repo}" = "$(cat VERSION)" || {
            echo "REPO_VERSION ${repo} does not match VERSION $(cat VERSION)"; exit 1; }
          file="dist/stats-${app}-macos-stats-${repo}.dmg"
          test -f "${file}" || { echo "shipped image missing: ${file}"; exit 1; }
          echo "${sha}  ${file}" | sha256sum -c -

      - name: Image retention
        run: |
          set -euo pipefail
          count="$(find dist -maxdepth 1 -name 'stats-*-macos-stats-*.dmg' | wc -l)"
          echo "versioned images in dist/: ${count}"
          test "${count}" -ge 1 || { echo "no versioned image"; exit 1; }
          test "${count}" -le 5 || { echo "more than five images kept"; exit 1; }
          if compgen -G "dist/stats-*.dmg" > /dev/null; then
            for f in dist/stats-*.dmg; do
              case "$f" in *-macos-stats-*) ;; *) echo "legacy unprefixed image: $f"; exit 1;; esac
            done
          fi

      - name: Workflow lint
        uses: raven-actions/actionlint@v2

      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "*.md" "docs/*.md"

      - name: Documentation links are local
        run: |
          set -euo pipefail
          if grep -rn "](/.workspace\|](/Users\|](/home" --include="*.md" .; then
            echo "absolute local paths in documentation"; exit 1
          fi
