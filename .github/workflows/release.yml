name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish image and checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
