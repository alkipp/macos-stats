name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish image and checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read versions
        id: v
        run: |
          echo "repo=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "app=$(grep -oE '^APP_VERSION="[^"]+"' install.sh | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: "macos-stats ${{ steps.v.outputs.repo }} – Stats ${{ steps.v.outputs.app }}"
          body: |
            Packages Stats ${{ steps.v.outputs.app }} for a macOS host: pinned image, installer, module key reference and provenance notes.

            Repository version: ${{ steps.v.outputs.repo }}. See `CHANGELOG.md` for what changed.
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
