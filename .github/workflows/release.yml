name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish image and checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read versions
        id: v
        run: |
          echo "repo=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "app=$(grep -oE '^APP_VERSION="[^"]+"' install.sh | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Select the image of this version
        id: img
        run: |
          set -euo pipefail
          file="dist/stats-${{ steps.v.outputs.app }}-macos-stats-${{ steps.v.outputs.repo }}.dmg"
          test -f "${file}" || { echo "no image for this version: ${file}"; exit 1; }
          echo "path=${file}" >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: |
          set -euo pipefail
          file="${{ steps.img.outputs.path }}"
          sha256sum -- "$file"
          ( cd dist && sha256sum -- "$(basename "$file")" > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: "macos-stats ${{ steps.v.outputs.repo }} – Stats ${{ steps.v.outputs.app }}"
          body: |
            Packages Stats ${{ steps.v.outputs.app }} for a macOS host: pinned image, installer, module key reference and provenance notes.

            Repository version: ${{ steps.v.outputs.repo }}. See `CHANGELOG.md` for what changed.
          files: |
            ${{ steps.img.outputs.path }}
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Retention - keep the five newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' > /tmp/old-releases.txt
          if [ ! -s /tmp/old-releases.txt ]; then
            echo "nothing to prune"
            exit 0
          fi
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            echo "deleting release ${tag} (assets only, the tag stays)"
            gh release delete "${tag}" --yes
          done < /tmp/old-releases.txt
