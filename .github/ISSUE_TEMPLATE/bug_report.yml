name: Bug report
description: The installer, a script or the documentation does not work
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For security problems use the private channel described in [SECURITY.md](../blob/main/SECURITY.md) instead of an issue.
  - type: input
    id: environment
    attributes:
      label: macOS version and hardware
      placeholder: macOS 27.0.1, Mac mini M2 Pro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Stats version
      placeholder: "3.0.23"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the exact command you ran.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Re-run the installer with `bash -x install.sh` and paste the relevant part. Remove anything private first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed secrets, tokens and personal data from the output
          required: true
        - label: I checked the existing issues for the same problem
          required: true
